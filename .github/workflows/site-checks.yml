name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify generated pages are committed
        run: git diff --exit-code -- index.html en/index.html pt-br/index.html privacy.html terms.html ethical-use.html pt-br/privacy.html pt-br/terms.html pt-br/ethical-use.html 404.html sitemap.xml
